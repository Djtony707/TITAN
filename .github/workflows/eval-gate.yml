name: Eval Gate

# v5.3.0: Block merges if any eval suite drops below the pass-rate threshold.
#
# Runs on every push to main and every PR. Spins up the gateway, hits each
# suite via /api/eval/run, computes pass rate, fails the job if any suite is
# below 80%. Suites are tested individually (not as a global rate) so a
# regression in one suite can't be hidden by passes in others.
#
# This is intentionally a SEPARATE workflow from ci.yml because:
#   1. It needs a running gateway (unit tests don't)
#   2. It's slow (real LLM calls per case) — keeping it separate means a
#      pure-typecheck PR doesn't have to wait on it.
#   3. Failing eval gate is a soft warning vs. failing typecheck (hard block);
#      the team can choose to require this status check or not in branch
#      protection rules.
#
# Threshold defaults to 80% per suite. Bump it once cloud-Kimi / Ollama
# baselines are stable for a few weeks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run via Actions UI — useful for cutting a release tag.
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Per-suite pass rate threshold (percentage)'
        required: false
        default: '80'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 11 suites × ~1-2 min each + boot/install overhead

    env:
      NODE_OPTIONS: --max-old-space-size=6144
      THRESHOLD: ${{ github.event.inputs.threshold || '80' }}
      # beta.11 — TITAN ships a deterministic CI stub provider. Setting
      # TITAN_STUB_PROVIDER=1 makes the model picker route to stub/echo
      # and pattern-match the eval-suite prompts to canned responses
      # (widget gates, tool calls, structured JSON, safety refusals).
      # Before this flag, every eval suite scored 0% because the router
      # had no provider with credentials to call. See src/providers/stub.ts.
      TITAN_STUB_PROVIDER: '1'
      TITAN_BENCH: '1'
      TITAN_TELEMETRY_ENABLED: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Prepare isolated authenticated eval gateway
        run: |
          set -euo pipefail
          umask 077
          export TITAN_HOME="$(mktemp -d "${RUNNER_TEMP}/titan-eval.XXXXXX")"
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { createServer } from 'node:net';
          import { join } from 'node:path';
          const probe = createServer();
          await new Promise(resolve => probe.listen(0, '127.0.0.1', resolve));
          const port = probe.address().port;
          await new Promise(resolve => probe.close(resolve));
          const token = randomBytes(32).toString('hex');
          console.log(`::add-mask::${token}`);
          const model = 'stub/echo';
          writeFileSync(join(process.env.TITAN_HOME, 'titan.json'), JSON.stringify({
            gateway: { host: '127.0.0.1', port, auth: { mode: 'token', token } },
            agent: { model, modelAliases: { default: model, fast: model, smart: model, cheap: model } },
            autonomy: { mode: 'supervised' },
            autopilot: { enabled: false },
            mesh: { enabled: false },
            commandPost: { enabled: false },
            memory: { vectorSearchEnabled: false },
            channels: { messenger: { enabled: false }, twilio: { enabled: false } },
            providers: { ollama: { enabled: false, baseUrl: 'http://127.0.0.1:0' } },
            voice: { enabled: false, ttsUrl: 'http://127.0.0.1:0' },
          }), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV,
            `TITAN_HOME=${process.env.TITAN_HOME}\nTITAN_EVAL_PORT=${port}\nTITAN_EVAL_URL=http://127.0.0.1:${port}\nTITAN_EVAL_TOKEN=${token}\n`);
          NODE

      - name: Boot TITAN gateway
        run: |
          set -euo pipefail
          # Background the gateway, wait for /api/health to come back 200.
          # v5.4.2: Increased to 180s — dependabot bumps added deps that extend
          # cold-start compilation time. 60s was generous for v5.3, insufficient
          # after 11 dep updates expanded the module graph.
          HOME="$TITAN_HOME" node dist/cli/index.js gateway --host 127.0.0.1 --port "$TITAN_EVAL_PORT" --skip-usable-check > /tmp/titan-gateway.log 2>&1 &
          echo $! > /tmp/titan-gateway.pid
          for i in $(seq 1 180); do
            if ! kill -0 "$(cat /tmp/titan-gateway.pid)" 2>/dev/null; then
              echo "::error::Isolated stub gateway exited before readiness"
              tail -100 /tmp/titan-gateway.log
              exit 1
            fi
            if curl -fs --max-time 2 -H "Authorization: Bearer $TITAN_EVAL_TOKEN" "$TITAN_EVAL_URL/api/health" > /dev/null 2>&1; then
              echo "Gateway ready after ${i}s"
              exit 0
            fi
            # Every 30s dump last 15 lines so slow-start is visible in CI log
            if [ $((i % 30)) -eq 0 ]; then
              echo "  ...still booting (${i}s elapsed)"
              tail -15 /tmp/titan-gateway.log || true
            fi
            sleep 1
          done
          echo "::error::Gateway did not become healthy within 180 seconds"
          tail -100 /tmp/titan-gateway.log
          exit 1

      - name: Run eval suites
        id: eval
        run: |
          # Mirrors scripts/eval-gate.sh logic. Kept inline so a CI-only env
          # (no jq dependency on the runner image) doesn't surprise us — the
          # ubuntu-latest image ships jq, but documenting the dep here.
          set -e
          SUITES="widget-creation safety tool-routing gate-format pipeline adversarial tool-routing-v2 session widget-v2 gate-format-v2 content"
          OVERALL_PASSED=0
          OVERALL_TOTAL=0
          FAILED_SUITES=""
          mkdir -p /tmp/eval-results
          for suite in $SUITES; do
            echo "── Running suite: $suite ──"
            HTTP_CODE=$(curl -s -o "/tmp/eval-results/${suite}.json" -w '%{http_code}' \
              --max-time 600 -X POST "$TITAN_EVAL_URL/api/eval/run" \
              -H "Authorization: Bearer $TITAN_EVAL_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"suite\":\"$suite\"}")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Suite $suite request failed with HTTP $HTTP_CODE"
              cat "/tmp/eval-results/${suite}.json" || true
              FAILED_SUITES="$FAILED_SUITES $suite"
              continue
            fi
            PASSED=$(jq '.passed // 0' "/tmp/eval-results/${suite}.json")
            TOTAL=$(jq '.total // 0' "/tmp/eval-results/${suite}.json")
            DURATION_MS=$(jq '.durationMs // 0' "/tmp/eval-results/${suite}.json")
            if [ "$TOTAL" = "0" ]; then
              echo "::error::Suite $suite has 0 cases — gateway returned empty result"
              FAILED_SUITES="$FAILED_SUITES $suite"
              continue
            fi
            RATE=$(awk "BEGIN {printf \"%.0f\", ($PASSED/$TOTAL)*100}")
            DUR_S=$(awk "BEGIN {printf \"%.1f\", $DURATION_MS/1000}")
            echo "  $suite: $PASSED/$TOTAL ($RATE%) in ${DUR_S}s"
            OVERALL_PASSED=$((OVERALL_PASSED + PASSED))
            OVERALL_TOTAL=$((OVERALL_TOTAL + TOTAL))
            if [ "$RATE" -lt "$THRESHOLD" ]; then
              echo "::error::Suite $suite pass rate $RATE% is below threshold $THRESHOLD%"
              FAILED_SUITES="$FAILED_SUITES $suite"
            fi
          done
          echo ""
          echo "── Summary ──"
          echo "Overall: $OVERALL_PASSED/$OVERALL_TOTAL"
          echo "overall_passed=$OVERALL_PASSED" >> "$GITHUB_OUTPUT"
          echo "overall_total=$OVERALL_TOTAL" >> "$GITHUB_OUTPUT"
          echo "failed_suites=$FAILED_SUITES" >> "$GITHUB_OUTPUT"
          if [ -n "$FAILED_SUITES" ]; then
            echo "::error::Failed suites: $FAILED_SUITES"
            exit 1
          fi

      - name: Stop gateway
        if: always()
        run: |
          if [ -f /tmp/titan-gateway.pid ]; then
            PID="$(cat /tmp/titan-gateway.pid)"
            kill "$PID" 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$PID" 2>/dev/null; then
              echo "::error::Owned gateway did not stop; private profile retained for runner cleanup"
              exit 1
            fi
          fi
          # This is only the private mktemp profile created by this job, never an owner home.
          if [[ "${TITAN_HOME:-}" == "$RUNNER_TEMP"/titan-eval.* ]]; then
            rm -rf -- "$TITAN_HOME"
          fi

      - name: Upload eval results + gateway log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-gate-${{ github.run_id }}
          path: |
            /tmp/eval-results/*.json
            /tmp/titan-gateway.log
          retention-days: 30
