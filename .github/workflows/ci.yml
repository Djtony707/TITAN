name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22]

    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Build UI
        run: npm run build:ui

      # Sharded run: each shard is a fresh `node` process. Vitest's
      # forks pool can't reliably kill a worker between files (we tried
      # — the fork is reused and heap accumulates across the suite,
      # OOMing around file ~100 of ~150). Splitting the run into two
      # shards is the simplest reliable knife: each shard starts with a
      # cold heap and stops well below the 4 GB cap.
      #
      # Heap + per-fork policy is still owned by `vitest.config.ts` —
      # do NOT pass `--max-workers` / `--min-workers` here, those flags
      # silently override `poolOptions.forks.{maxForks,minForks}`.
      - name: Run tests (shard 1/2)
        run: npx vitest run --reporter=verbose --shard=1/2

      - name: Run tests (shard 2/2)
        run: npx vitest run --reporter=verbose --shard=2/2

  health:
    needs: test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency check (all 5 files must match)
        run: |
          PKG_VER=$(node -e "console.log(require('./package.json').version)")
          CONST_VER=$(grep -oP "TITAN_VERSION\s*=\s*'(\K[^']+)" src/utils/constants.ts || echo "NOT_FOUND")
          CORE_TEST_VER=$(grep -oP "toBe\('(\K\d+\.\d+\.\d+)" tests/core.test.ts | head -1 || echo "NOT_FOUND")
          MC_TEST_COUNT=$(grep -c "$PKG_VER" tests/mission-control.test.ts || echo "0")
          CHANGELOG_VER=$(grep -oP "^## \[?(\K\d+\.\d+\.\d+)" CHANGELOG.md | head -1 || echo "NOT_FOUND")

          echo "package.json:              $PKG_VER"
          echo "constants.ts:              $CONST_VER"
          echo "core.test.ts:              $CORE_TEST_VER"
          echo "mission-control.test.ts:   $MC_TEST_COUNT occurrences"
          echo "CHANGELOG.md:              $CHANGELOG_VER"

          FAIL=0
          if [ "$CONST_VER" != "$PKG_VER" ]; then
            echo "::error::constants.ts version ($CONST_VER) does not match package.json ($PKG_VER)"
            FAIL=1
          fi
          if [ "$CORE_TEST_VER" != "$PKG_VER" ]; then
            echo "::error::core.test.ts version ($CORE_TEST_VER) does not match package.json ($PKG_VER)"
            FAIL=1
          fi
          if [ "$MC_TEST_COUNT" -lt 4 ]; then
            echo "::error::mission-control.test.ts has only $MC_TEST_COUNT occurrences of $PKG_VER (need 4)"
            FAIL=1
          fi
          if [ "$CHANGELOG_VER" != "$PKG_VER" ]; then
            echo "::error::CHANGELOG.md latest version ($CHANGELOG_VER) does not match package.json ($PKG_VER)"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All 5 version locations match: $PKG_VER"

      - name: npm publish dry-run
        run: npm publish --dry-run 2>&1

      - name: Docker build smoke test
        run: docker build --target deps -t titan-deps-test . 2>&1 | tail -5
